name: E2E against Vercel preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL to test against (default: wait for Vercel auto-deploy)"
        required: false
        default: ""

concurrency:
  group: e2e-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-against-preview:
    name: Wait for Vercel deploy + run Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers + Linux deps
        run: pnpm exec playwright install --with-deps chromium

      # ----------------------------------------------------------------
      # The Vercel GitHub integration auto-deploys every commit and posts
      # a GitHub deployment status (state=success|failure, environment_url).
      # We poll that API until we see a success → use that URL.
      # No Vercel API token needed — just GITHUB_TOKEN.
      # ----------------------------------------------------------------
      - name: Resolve target URL
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDE_URL: ${{ github.event.inputs.base_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -e
          if [ -n "$OVERRIDE_URL" ]; then
            echo "url=$OVERRIDE_URL" >> "$GITHUB_OUTPUT"
            echo "Using override URL: $OVERRIDE_URL"
            exit 0
          fi

          echo "Waiting for Vercel deployment status on commit $SHA"
          for i in $(seq 1 60); do
            # Find the most recent deployment for this commit
            deploys=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=5" \
              -q '[.[] | select(.environment | test("Production|Preview")) | .id]')
            for did in $(echo "$deploys" | jq -r '.[]'); do
              status=$(gh api "repos/$REPO/deployments/$did/statuses?per_page=1" \
                -q '.[0] | {state, environment_url}')
              state=$(echo "$status" | jq -r '.state')
              url=$(echo "$status" | jq -r '.environment_url // empty')
              if [ "$state" = "success" ] && [ -n "$url" ]; then
                echo "url=$url" >> "$GITHUB_OUTPUT"
                echo "✓ Vercel deploy ready: $url (deployment $did)"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "✗ Vercel deploy failed for $did" >&2
                gh api "repos/$REPO/deployments/$did/statuses?per_page=1" -q '.[0]' >&2
                exit 1
              fi
            done
            echo "  attempt $i/60: no successful deploy yet, sleeping 15s"
            sleep 15
          done
          echo "Timed out waiting for Vercel deploy" >&2
          exit 1

      - name: Sanity check the URL responds
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.target.outputs.url }}/" || echo "000")
            if [ "$code" = "200" ]; then
              echo "✓ ${{ steps.target.outputs.url }} → HTTP $code"
              exit 0
            fi
            echo "  attempt $i: HTTP $code, retrying..."
            sleep 5
          done
          echo "URL did not respond with 200" >&2
          exit 1

      # ----------------------------------------------------------------
      # globalSetup signs in via /api/auth/otp with the test phone and
      # writes the Supabase SSR cookie to playwright/.auth/user.json.
      # use.storageState in playwright.config.ts loads it for every test.
      # ----------------------------------------------------------------
      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL:  ${{ steps.target.outputs.url }}
          SKIP_WEB_SERVER:      "1"
          E2E_TEST_PHONE:       ${{ secrets.E2E_TEST_PHONE }}
          E2E_TEST_OTP_SECRET:  ${{ secrets.E2E_TEST_OTP_SECRET }}
          CI:                   "true"
        run: |
          pnpm exec playwright test \
            --project=desktop-chrome \
            --reporter=list,html \
            --retries=1

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots/traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 14

      - name: Comment preview URL on PR
        if: ${{ github.event_name == 'pull_request' && github.event.inputs.base_url == '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.target.outputs.url }}';
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${emoji} **E2E preview** — ${status}\n\n- Preview URL: ${url}\n- Report: see the **playwright-report** artifact on this run.`,
            });
